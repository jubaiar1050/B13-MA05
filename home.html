<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github issue tacker</title>

    <!-- daisyUi and tailwind css -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font name -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- css style -->
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            font-family: "Geist", sans-serif;
        }
    </style>

</head>

<body>
    <!-- header section -->
    <header>
        <nav class="flex flex-col md:flex-row justify-between items-center bg-base-100 py-5 px-10 shadow-md">
            <div class="flex items-center gap-3">
                <img class="w-9 h-9" src="assets/github-logo.png" alt="">
                <h2 class="font-semibold text-2xl">GitHub Issues Tracker</h2>
            </div>
            <div class="join mt-4">
                <div>
                    <label class="input validator join-item">
                        <input id="Search-issue" type="text" placeholder="Search issue" required />
                    </label>
                    <div class="validator-hint hidden">Enter valid email address</div>
                </div>
                <button id="search-btn" class="btn btn-primary join-item">Search</button>
            </div>
        </nav>
    </header>

    <!-- tab section -->
    <section
        class="max max-w-5xl bg-base-100 mx-auto mt-12 space-x-3 shadow-[0_2px_10px_rgba(0,0,0,0.15)] rounded-lg py-4 px-6">
        <button onclick="switchTab('all')" id="all-tab" class="btn">all</button>
        <button onclick="switchTab('open')" id="open-tab" class="btn">open</button>
        <button onclick="switchTab('closed')" id="closed-tab" class="btn">closed</button>
    </section>

    <div class="max max-w-5xl bg-base-200 mx-auto my-12 shadow-[0_2px_10px_rgba(0,0,0,0.15)] rounded-lg">
        <section
            class="bg-white border-b border-gray-200 flex flex-col md:flex-row justify-between items-center p-6 rounded-t-lg">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-violet-200 rounded-full">
                    <img src="assets/Aperture.png" alt="">
                </div>
                <div>
                    <h2 class="font-semibold text-2xl"><span id="available-issue">0</span> Issues</h2>
                    <p class="text-neutral/50">Track and manege your project issues</p>
                </div>
            </div>
            <div class="space-x-5 mt-3">
                <span class="font-medium text-lg"><i class="fa-solid fa-circle mr-2 text-green-500"></i>Open</span>
                <span class="font-medium text-lg"><i class="fa-solid fa-circle mr-2 text-violet-500"></i>Closed</span>
            </div>
        </section>
        <section id="all-container" class="py-6 max-w-[1000px] mx-auto grid grid-cols-1 w-11/12 md:grid-cols-3 gap-4">

        </section>
        <section id="open-container" class="py-6 max-w-[1000px] mx-auto grid grid-cols-1 w-11/12 md:grid-cols-3 gap-4">
        </section>
        <section id="closed-container"
            class="py-6 max-w-[1000px] mx-auto grid grid-cols-1 w-11/12 md:grid-cols-3 gap-4">
        </section>

    </div>

    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
    <dialog id="my_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <div id="modal-content" class="p-5 space-y-3">

            </div>
            <div class="modal-action">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn btn-primary rounded-lg">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="script/home.js"></script>
</body>

</html>
